name: Run Kaggle Notebook - Movie Pipeline

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      notebook:
        description: 'Nome do Notebook'
        required: false
        default: 'movie_pipeline_master'

jobs:
  run-notebook:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: pip install kaggle

      - name: Configure Kaggle Account
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          echo "🔑 Configurando conta Kaggle (${KAGGLE_USERNAME})"
          mkdir -p ~/.kaggle
          echo "{\"username\":\"${KAGGLE_USERNAME}\",\"key\":\"${KAGGLE_KEY}\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "KAGGLE_USER=${KAGGLE_USERNAME}" >> $GITHUB_ENV

      - name: Inject Secrets & Push Notebook to Kaggle
        env:
          NOTEBOOK: ${{ github.event.client_payload.notebook || github.event.inputs.notebook || 'movie_pipeline_master' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_VIP_CHANNEL_ID: ${{ secrets.TELEGRAM_VIP_CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID || secrets.TELEGRAM_ADMIN_ID }}
        run: |
          echo "📓 Notebook selecionado: ${NOTEBOOK}"
          echo "👤 Conta Kaggle: ${KAGGLE_USER}"

          # Injeta os secrets do GitHub no notebook .ipynb
          python inject_secrets.py

          cd notebooks/
          # Se o inject colocou em notebooks/, ajusta localizacao
          if [ -f "../${NOTEBOOK}.ipynb" ]; then
            cp "../${NOTEBOOK}.ipynb" "${NOTEBOOK}.ipynb"
          fi

          # Gera o kernel-metadata.json para o Kaggle CLI
          python3 -c "
          import json
          meta = {
            'id': '${KAGGLE_USER}/${NOTEBOOK}',
            'title': '${NOTEBOOK}',
            'code_file': '${NOTEBOOK}.ipynb',
            'language': 'python',
            'kernel_type': 'notebook',
            'is_private': True,
            'enable_gpu': True,
            'enable_internet': True,
            'dataset_sources': [],
            'competition_sources': [],
            'kernel_sources': []
          }
          with open('kernel-metadata.json', 'w') as f:
            json.dump(meta, f, indent=2)
          print(open('kernel-metadata.json').read())
          "

          # Push com GPU T4 forçada no Kaggle
          kaggle kernels push -p . --accelerator NvidiaTeslaT4
          echo ""
          echo "🚀 Notebook '${NOTEBOOK}' enviado e acionado no Kaggle com sucesso!"
